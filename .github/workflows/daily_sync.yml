name: Manual Stock Data Sync

# The scheduled daily update runs on Azure (deploy/azure/deploy_container_apps_job.sh).
# This workflow is a manual fallback only: it runs one batch from a GitHub runner.
# Needs repository secrets AZURE_POSTGRES_HOST, AZURE_POSTGRES_DB, AZURE_POSTGRES_USER,
# AZURE_POSTGRES_PASSWORD, FINNHUB_API_KEY and FRED_API_KEY.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Stocks to process in this batch"
        default: "70"
      preview:
        description: "Only list the next batch, export nothing"
        type: boolean
        default: true

jobs:
  sync-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run one batch
      env:
        TZ: Asia/Kolkata
        AZURE_POSTGRES_HOST: ${{ secrets.AZURE_POSTGRES_HOST }}
        AZURE_POSTGRES_PORT: "5432"
        AZURE_POSTGRES_DB: ${{ secrets.AZURE_POSTGRES_DB }}
        AZURE_POSTGRES_USER: ${{ secrets.AZURE_POSTGRES_USER }}
        AZURE_POSTGRES_PASSWORD: ${{ secrets.AZURE_POSTGRES_PASSWORD }}
        AZURE_POSTGRES_SSLMODE: require
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: |
        python database/cron_update_runner.py --force --limit "${{ inputs.limit }}" ${{ inputs.preview && '--preview' || '' }}
